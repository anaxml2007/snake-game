<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neon Snake - Pro (1234x346)</title>
    <style>
        body { 
            background: radial-gradient(circle at center, #0a0a1a 0%, #050505 100%); 
            color: #fff; 
            text-align: center; 
            font-family: 'Segoe UI', sans-serif; 
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 {
            text-shadow: 0 0 20px #0f0, 0 0 40px #0f0;
            animation: pulse 2s ease-in-out infinite;
            margin: 10px 0;
            font-size: 28px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        .controls { margin: 10px 0; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .btn { 
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); 
            color: #fff; 
            border: 2px solid #0f0; 
            padding: 8px 16px; 
            cursor: pointer; 
            border-radius: 8px;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(0,255,0,0.3);
            font-size: 14px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(0,255,0,0.6); }
        .btn.active { 
            background: linear-gradient(135deg, #0f0 0%, #00cc00 100%); 
            color: #000; 
            font-weight: bold; 
            border-color: #0f0;
            box-shadow: 0 0 30px rgba(0,255,0,0.8);
        }
        #achievement-box { 
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 8px 16px; 
            border-radius: 25px; 
            display: inline-block; 
            margin: 5px; 
            border: 2px solid #ffd700; 
            font-weight: bold; 
            color: #ffd700;
            box-shadow: 0 0 15px rgba(255,215,0,0.4);
            font-size: 14px;
        }
        #score { font-size: 20px; margin: 5px; text-shadow: 0 0 10px #0f0; }
        
        /* Responsive Canvas Container */
        #game-container {
            position: relative;
            width: 95vw;
            max-width: 1234px;
            height: auto;
            aspect-ratio: 1234 / 346;
            margin: 10px auto;
        }
        canvas { 
            width: 100%;
            height: 100%;
            border: 4px solid #0f0; 
            background: #000;
            border-radius: 10px; 
            box-shadow: 0 0 30px rgba(0,255,0,0.5), inset 0 0 50px rgba(0,255,0,0.1);
            display: block;
        }
        
        #game-over { 
            position: absolute; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            background: rgba(0,0,0,0.95); 
            padding: 30px; 
            border-radius: 20px; 
            border: 3px solid #f00; 
            display: none; 
            z-index: 10;
            box-shadow: 0 0 50px rgba(255,0,0,0.6);
            animation: slideIn 0.5s ease-out;
            text-align: center;
        }
        @keyframes slideIn {
            from { transform: translate(-50%, -60%); opacity: 0; }
            to { transform: translate(-50%, -50%); opacity: 1; }
        }
        #game-over h2 { color: #f00; margin-top: 0; text-shadow: 0 0 20px #f00; font-size: 32px; }
        #game-over button { 
            background: linear-gradient(135deg, #0f0 0%, #00cc00 100%); 
            color: #000; border: none; padding: 10px 24px; 
            font-size: 16px; cursor: pointer; border-radius: 8px; 
            margin-top: 15px; font-weight: bold;
            box-shadow: 0 0 20px rgba(0,255,0,0.5); transition: all 0.3s;
        }
        #game-over button:hover { transform: scale(1.1); box-shadow: 0 0 30px rgba(0,255,0,0.8); }
    </style>
</head>
<body>
    <h1> NEON SNAKE ⚡</h1>
    <div class="controls">
        <button class="btn" id="easy" onclick="setSpeed(180, 'easy')">Easy</button>
        <button class="btn active" id="medium" onclick="setSpeed(110, 'medium')">Medium</button>
        <button class="btn" id="hard" onclick="setSpeed(60, 'hard')">Hard</button>
        <button class="btn" onclick="togglePause()"> Pause</button>
    </div>
    <div id="achievement-box">🏆 RANK: <span id="rank">Beginner</span></div>
    <div id="score">Score: 0</div>
    
    <div id="game-container">
        <canvas id="game"></canvas>
        <div id="game-over">
            <h2>💀 GAME OVER!</h2>
            <p style="font-size: 18px;">Final Score: <span id="final-score">0</span></p>
            <button onclick="start()">🔄 Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        
        // Dynamic sizing for 1234x346
        const CONTAINER_WIDTH = 1234;
        const CONTAINER_HEIGHT = 346;
        const CELL_SIZE = Math.floor(CONTAINER_WIDTH / 50); // ~24px cells, 50 columns
        const COLS = Math.floor(CONTAINER_WIDTH / CELL_SIZE);
        const ROWS = Math.floor(CONTAINER_HEIGHT / CELL_SIZE);
        
        // Set actual canvas resolution
        canvas.width = COLS * CELL_SIZE;
        canvas.height = ROWS * CELL_SIZE;
        
        let snake = [{x: Math.floor(COLS/2)*CELL_SIZE, y: Math.floor(ROWS/2)*CELL_SIZE}];
        let food = {x: 0, y: 0};
        let dx = CELL_SIZE, dy = 0;
        let score = 0, speed = 110, paused = false, gameOver = false;
        let particles = [];
        let foodPulse = 0, foodDirection = 1;

        function setSpeed(s, id) {
            speed = s;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            start();
        }
        
        function togglePause() { if (!gameOver) paused = !paused; }

        function generateFood() {
            let newFood, validPosition = false;
            while (!validPosition) {
                newFood = {
                    x: Math.floor(Math.random() * COLS) * CELL_SIZE,
                    y: Math.floor(Math.random() * ROWS) * CELL_SIZE
                };
                validPosition = true;
                for (let segment of snake) {
                    if (segment.x === newFood.x && segment.y === newFood.y) {
                        validPosition = false; break;
                    }
                }
            }
            return newFood;
        }

        function createParticles(x, y) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x + CELL_SIZE/2, y: y + CELL_SIZE/2,
                    vx: (Math.random() - 0.5) * (CELL_SIZE/2),
                    vy: (Math.random() - 0.5) * (CELL_SIZE/2),
                    life: 1, color: `hsl(${Math.random()*60+10}, 100%, 50%)`
                });
            }
        }

        function updateParticles() {
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                p.life -= 0.05; p.vx *= 0.95; p.vy *= 0.95;
            });
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, (CELL_SIZE/6) * p.life, 0, Math.PI*2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        function showGameOver() {
            gameOver = true;
            clearInterval(window.gameLoop);
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over').style.display = 'block';
        }

        function start() {
            snake = [{x: Math.floor(COLS/2)*CELL_SIZE, y: Math.floor(ROWS/2)*CELL_SIZE}];
            score = 0; dx = CELL_SIZE; dy = 0;
            paused = false; gameOver = false; particles = [];
            food = generateFood();
            document.getElementById("score").innerText = "Score: 0";
            document.getElementById("rank").innerText = "Beginner";
            document.getElementById('game-over').style.display = 'none';
            clearInterval(window.gameLoop);
            window.gameLoop = setInterval(draw, speed);
        }

        function draw() {
            if(paused || gameOver) return;
            
            ctx.fillStyle = "#000"; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Subtle grid
            ctx.strokeStyle = "rgba(0,255,0,0.05)";
            ctx.lineWidth = 1;
            for(let i=0; i<=COLS; i++) {
                ctx.beginPath(); ctx.moveTo(i*CELL_SIZE,0); ctx.lineTo(i*CELL_SIZE,canvas.height); ctx.stroke();
            }
            for(let i=0; i<=ROWS; i++) {
                ctx.beginPath(); ctx.moveTo(0,i*CELL_SIZE); ctx.lineTo(canvas.width,i*CELL_SIZE); ctx.stroke();
            }
            
            // Animated food
            foodPulse += 0.1 * foodDirection;
            if(foodPulse > 1 || foodPulse < 0) foodDirection *= -1;
            
            ctx.shadowBlur = 20 + foodPulse*10;
            ctx.shadowColor = "#f00";
            ctx.fillStyle = "#ff0000";
            ctx.beginPath();
            ctx.arc(food.x + CELL_SIZE/2, food.y + CELL_SIZE/2, (CELL_SIZE/2.5) + foodPulse*(CELL_SIZE/10), 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Apple stem
            ctx.strokeStyle = "#00ff00";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(food.x + CELL_SIZE/2, food.y + CELL_SIZE/5);
            ctx.lineTo(food.x + CELL_SIZE/2, food.y - CELL_SIZE/10);
            ctx.stroke();

            // Draw Snake (Chunky 15x15 equivalent scaled to cell size)
            const segSize = CELL_SIZE * 0.75; // 75% of cell = visually chunky
            const offset = (CELL_SIZE - segSize) / 2;
            
            snake.forEach((s, i) => {
                if(i === 0) {
                    ctx.fillStyle = "#ffffff";
                    ctx.shadowBlur = 30; ctx.shadowColor = "#00ff00";
                } else {
                    const brightness = Math.max(40, 60 - (i*0.8));
                    ctx.fillStyle = `hsl(120, 100%, ${brightness}%)`;
                    ctx.shadowBlur = Math.max(5, 15-(i*0.5));
                    ctx.shadowColor = "#00ff00";
                }
                
                ctx.beginPath();
                if(ctx.roundRect) ctx.roundRect(s.x+offset, s.y+offset, segSize, segSize, segSize/4);
                else ctx.rect(s.x+offset, s.y+offset, segSize, segSize);
                ctx.fill();
                ctx.shadowBlur = 0;
                
                // Two eyes scaled to cell size
                if(i === 0) {
                    ctx.fillStyle = "#0000aa";
                    const eyeSize = segSize / 4;
                    const eyeOffset = segSize / 3;
                    
                    if(dx > 0) { // RIGHT
                        ctx.fillRect(s.x + segSize - eyeOffset, s.y + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(s.x + segSize - eyeOffset, s.y + segSize - eyeOffset - eyeSize, eyeSize, eyeSize);
                    } else if(dx < 0) { // LEFT
                        ctx.fillRect(s.x + eyeOffset, s.y + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(s.x + eyeOffset, s.y + segSize - eyeOffset - eyeSize, eyeSize, eyeSize);
                    } else if(dy > 0) { // DOWN
                        ctx.fillRect(s.x + eyeOffset, s.y + segSize - eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(s.x + segSize - eyeOffset - eyeSize, s.y + segSize - eyeOffset, eyeSize, eyeSize);
                    } else if(dy < 0) { // UP
                        ctx.fillRect(s.x + eyeOffset, s.y + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(s.x + segSize - eyeOffset - eyeSize, s.y + eyeOffset, eyeSize, eyeSize);
                    }
                }
            });

            updateParticles(); drawParticles();

            let head = {x: snake[0].x + dx, y: snake[0].y + dy};
            
            if(head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                showGameOver(); return;
            }
            for(let i=0; i<snake.length; i++) {
                if(head.x === snake[i].x && head.y === snake[i].y) {
                    showGameOver(); return;
                }
            }
            
            snake.unshift(head);
            if(head.x === food.x && head.y === food.y) {
                score++; createParticles(food.x, food.y);
                food = generateFood();
                document.getElementById("score").innerText = "Score: " + score;
                if(score>=5) document.getElementById("rank").innerText="🥉 Bronze Viper";
                if(score>=15) document.getElementById("rank").innerText=" Silver Legend";
                if(score>=30) document.getElementById("rank").innerText="🥇 Gold Master";
                if(score>=50) document.getElementById("rank").innerText="💎 Diamond Champion";
            } else snake.pop();
        }
        
        document.addEventListener("keydown", e => {
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
            if(e.key === " ") togglePause();
            if(gameOver) return;
            if(e.key==="ArrowUp" && dy===0) { dx=0; dy=-CELL_SIZE; }
            if(e.key==="ArrowDown" && dy===0) { dx=0; dy=CELL_SIZE; }
            if(e.key==="ArrowLeft" && dx===0) { dx=-CELL_SIZE; dy=0; }
            if(e.key==="ArrowRight" && dx===0) { dx=CELL_SIZE; dy=0; }
        });
        
        start();
    </script>
</body>
</html>
