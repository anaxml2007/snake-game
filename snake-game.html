<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neon Snake - Pro</title>
    <style>
        body { 
            background: radial-gradient(circle at center, #0a0a1a 0%, #050505 100%); 
            color: #fff; 
            text-align: center; 
            font-family: 'Segoe UI', sans-serif; 
            overflow: hidden;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-shadow: 0 0 20px #0f0, 0 0 40px #0f0;
            animation: pulse 2s ease-in-out infinite;
            margin-bottom: 10px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        .controls { margin: 15px; }
        .btn { 
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); 
            color: #fff; 
            border: 2px solid #0f0; 
            padding: 10px 20px; 
            cursor: pointer; 
            margin: 5px; 
            border-radius: 8px;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(0,255,0,0.3);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0,255,0,0.6);
        }
        .btn.active { 
            background: linear-gradient(135deg, #0f0 0%, #00cc00 100%); 
            color: #000; 
            font-weight: bold; 
            border-color: #0f0;
            box-shadow: 0 0 30px rgba(0,255,0,0.8);
        }
        #achievement-box { 
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 10px 20px; 
            border-radius: 25px; 
            display: inline-block; 
            margin: 10px; 
            border: 2px solid #ffd700; 
            font-weight: bold; 
            color: #ffd700;
            box-shadow: 0 0 15px rgba(255,215,0,0.4);
        }
        #score {
            font-size: 24px;
            margin: 10px;
            text-shadow: 0 0 10px #0f0;
        }
        canvas { 
            border: 4px solid #0f0; 
            background: #000;
            display: block; 
            margin: 10px auto; 
            border-radius: 10px; 
            box-shadow: 0 0 30px rgba(0,255,0,0.5), inset 0 0 50px rgba(0,255,0,0.1);
        }
        #game-over { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            background: rgba(0,0,0,0.95); 
            padding: 40px; 
            border-radius: 20px; 
            border: 3px solid #f00; 
            display: none; 
            z-index: 10;
            box-shadow: 0 0 50px rgba(255,0,0,0.6);
            animation: slideIn 0.5s ease-out;
        }
        @keyframes slideIn {
            from { transform: translate(-50%, -60%); opacity: 0; }
            to { transform: translate(-50%, -50%); opacity: 1; }
        }
        #game-over h2 { 
            color: #f00; 
            margin-top: 0;
            text-shadow: 0 0 20px #f00;
            font-size: 36px;
        }
        #game-over button { 
            background: linear-gradient(135deg, #0f0 0%, #00cc00 100%); 
            color: #000; 
            border: none; 
            padding: 12px 30px; 
            font-size: 18px; 
            cursor: pointer; 
            border-radius: 8px; 
            margin-top: 15px;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(0,255,0,0.5);
            transition: all 0.3s;
        }
        #game-over button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(0,255,0,0.8);
        }
    </style>
</head>
<body>
    <h1>⚡ NEON SNAKE ⚡</h1>
    <div class="controls">
        <button class="btn" id="easy" onclick="setSpeed(180, 'easy')">Easy</button>
        <button class="btn active" id="medium" onclick="setSpeed(110, 'medium')">Medium</button>
        <button class="btn" id="hard" onclick="setSpeed(60, 'hard')">Hard</button>
        <button class="btn" onclick="togglePause()">⏸ Pause/Resume</button>
    </div>
    <div id="achievement-box">🏆 RANK: <span id="rank">Beginner</span></div>
    <div id="score">Score: 0</div>
    <canvas id="game" width="400" height="400"></canvas>
    
    <div id="game-over">
        <h2>💀 GAME OVER!</h2>
        <p style="font-size: 20px;">Final Score: <span id="final-score">0</span></p>
        <button onclick="start()">🔄 Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        let snake = [{x: 200, y: 200}], food = {x: 100, y: 100}, dx = 20, dy = 0, score = 0, speed = 110, paused = false, gameOver = false;
        
        // Particle system for eating effect
        let particles = [];
        
        // Food animation
        let foodPulse = 0;
        let foodDirection = 1;

        function setSpeed(s, id) {
            speed = s;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            start();
        }
        
        function togglePause() { 
            if (!gameOver) paused = !paused; 
        }

        function generateFood() {
            let newFood;
            let validPosition = false;
            
            while (!validPosition) {
                newFood = {
                    x: Math.floor(Math.random() * 20) * 20,
                    y: Math.floor(Math.random() * 20) * 20
                };
                
                validPosition = true;
                for (let segment of snake) {
                    if (segment.x === newFood.x && segment.y === newFood.y) {
                        validPosition = false;
                        break;
                    }
                }
            }
            
            return newFood;
        }

        function createParticles(x, y) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x + 10,
                    y: y + 10,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 1,
                    color: `hsl(${Math.random() * 60 + 10}, 100%, 50%)`
                });
            }
        }

        function updateParticles() {
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                p.vx *= 0.95;
                p.vy *= 0.95;
            });
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        function showGameOver() {
            gameOver = true;
            clearInterval(window.gameLoop);
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over').style.display = 'block';
        }

        function start() {
            snake = [{x: 200, y: 200}]; 
            score = 0; 
            dx = 20; 
            dy = 0; 
            paused = false; 
            gameOver = false;
            particles = [];
            food = generateFood();
            document.getElementById("score").innerText = "Score: 0";
            document.getElementById("rank").innerText = "Beginner";
            document.getElementById('game-over').style.display = 'none';
            clearInterval(window.gameLoop);
            window.gameLoop = setInterval(draw, speed);
        }

        function draw() {
            if(paused || gameOver) return;
            
            // Clear canvas completely (no fade trail)
            ctx.fillStyle = "#000"; 
            ctx.fillRect(0, 0, 400, 400);
            
            // Draw grid lines (subtle)
            ctx.strokeStyle = "rgba(0, 255, 0, 0.05)";
            ctx.lineWidth = 1;
            for (let i = 0; i <= 400; i += 20) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, 400);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(400, i);
                ctx.stroke();
            }
            
            // Animate food
            foodPulse += 0.1 * foodDirection;
            if (foodPulse > 1 || foodPulse < 0) foodDirection *= -1;
            
            // Draw glowing food
            ctx.shadowBlur = 20 + foodPulse * 10;
            ctx.shadowColor = "#f00";
            ctx.fillStyle = "#ff0000";
            ctx.beginPath();
            ctx.arc(food.x + 10, food.y + 10, 8 + foodPulse * 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Draw apple stem
            ctx.strokeStyle = "#00ff00";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(food.x + 10, food.y + 2);
            ctx.lineTo(food.x + 10, food.y - 3);
            ctx.stroke();

            // Draw Snake with bright colors
            snake.forEach((s, i) => {
                // Bright gradient from head to tail
                if (i === 0) {
                    // Head - bright white with strong glow
                    ctx.fillStyle = "#ffffff";
                    ctx.shadowBlur = 25;
                    ctx.shadowColor = "#00ff00";
                } else {
                    // Body - bright green fading slightly
                    const brightness = Math.max(40, 60 - (i * 0.8));
                    ctx.fillStyle = `hsl(120, 100%, ${brightness}%)`;
                    ctx.shadowBlur = Math.max(5, 15 - (i * 0.5));
                    ctx.shadowColor = "#00ff00";
                }
                
                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(s.x + 1, s.y + 1, 18, 18, 5);
                } else {
                    ctx.rect(s.x + 1, s.y + 1, 18, 18);
                }
                ctx.fill();
                ctx.shadowBlur = 0;
                
                // Draw TWO EYES on head
                if (i === 0) {
                    ctx.fillStyle = "#000000";
                    
                    if (dx > 0) { // Moving RIGHT
                        ctx.fillRect(s.x + 12, s.y + 5, 4, 4);   // Top eye
                        ctx.fillRect(s.x + 12, s.y + 11, 4, 4);  // Bottom eye
                    } else if (dx < 0) { // Moving LEFT
                        ctx.fillRect(s.x + 4, s.y + 5, 4, 4);    // Top eye
                        ctx.fillRect(s.x + 4, s.y + 11, 4, 4);   // Bottom eye
                    } else if (dy > 0) { // Moving DOWN
                        ctx.fillRect(s.x + 5, s.y + 12, 4, 4);   // Left eye
                        ctx.fillRect(s.x + 11, s.y + 12, 4, 4);  // Right eye
                    } else if (dy < 0) { // Moving UP
                        ctx.fillRect(s.x + 5, s.y + 5, 4, 4);    // Left eye
                        ctx.fillRect(s.x + 11, s.y + 5, 4, 4);   // Right eye
                    }
                }
            });

            // Update and draw particles
            updateParticles();
            drawParticles();

            let head = {x: snake[0].x + dx, y: snake[0].y + dy};
            
            // Check wall collision
            if(head.x < 0 || head.x >= 400 || head.y < 0 || head.y >= 400) {
                showGameOver();
                return;
            }
            
            // Check self-collision
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    showGameOver();
                    return;
                }
            }
            
            snake.unshift(head);
            
            if(head.x === food.x && head.y === food.y) {
                score++; 
                createParticles(food.x, food.y);
                food = generateFood();
                document.getElementById("score").innerText = "Score: " + score;
                if(score >= 5) document.getElementById("rank").innerText = "🥉 Bronze Viper";
                if(score >= 15) document.getElementById("rank").innerText = "🥈 Silver Legend";
                if(score >= 30) document.getElementById("rank").innerText = "🥇 Gold Master";
                if(score >= 50) document.getElementById("rank").innerText = "💎 Diamond Champion";
            } else {
                snake.pop();
            }
        }
        
        document.addEventListener("keydown", e => {
            if(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) {
                e.preventDefault();
            }
            
            if(e.key === " ") {
                togglePause();
            }
            if(gameOver) return;
            
            if(e.key === "ArrowUp" && dy === 0) { dx=0; dy=-20; }
            if(e.key === "ArrowDown" && dy === 0) { dx=0; dy=20; }
            if(e.key === "ArrowLeft" && dx === 0) { dx=-20; dy=0; }
            if(e.key === "ArrowRight" && dx === 0) { dx=20; dy=0; }
        });
        
        start();
    </script>
</body>
</html>
