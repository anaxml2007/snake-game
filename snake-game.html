<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neon Snake - Pro</title>
    <style>
        body { background: #050505; color: #fff; text-align: center; font-family: 'Segoe UI', sans-serif; }
        .controls { margin: 15px; }
        .btn { background: #222; color: #fff; border: 1px solid #444; padding: 10px 20px; cursor: pointer; margin: 5px; border-radius: 5px; }
        .btn.active { background: #0f0; color: #000; font-weight: bold; border-color: #0f0; }
        #achievement-box { background: #222; padding: 8px 18px; border-radius: 25px; display: inline-block; margin: 10px; border: 1px solid #fff; font-weight: bold; color: #fff; }
        canvas { border: 4px solid #0f0; background: #000; display: block; margin: 10px auto; border-radius: 10px; box-shadow: 0 0 20px rgba(0,255,0,0.3); }
    </style>
</head>
<body>
    <h1>NEON SNAKE</h1>
    <div class="controls">
        <button class="btn" id="easy" onclick="setSpeed(180, 'easy')">Easy</button>
        <button class="btn active" id="medium" onclick="setSpeed(110, 'medium')">Medium</button>
        <button class="btn" id="hard" onclick="setSpeed(60, 'hard')">Hard</button>
        <button class="btn" onclick="togglePause()">Pause/Resume</button>
    </div>
    <div id="achievement-box">🏆 RANK: <span id="rank">Beginner</span></div>
    <div id="score">Score: 0</div>
    <canvas id="game" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        let snake = [{x: 200, y: 200}], food = {x: 100, y: 100}, dx = 20, dy = 0, score = 0, speed = 110, paused = false;

        function setSpeed(s, id) {
            speed = s;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            start();
        }
        function togglePause() { paused = !paused; }

        function start() {
            snake = [{x: 200, y: 200}]; score = 0; dx = 20; dy = 0; paused = false;
            clearInterval(window.gameLoop);
            window.gameLoop = setInterval(draw, speed);
        }

        function draw() {
            if(paused) return;
            ctx.fillStyle = "#000"; ctx.fillRect(0,0,400,400);
            
            // Draw Snake (Rounded & Eyes)
            snake.forEach((s, i) => {
                ctx.fillStyle = i === 0 ? "#fff" : "#0f0";
                ctx.beginPath();
                ctx.roundRect(s.x+2, s.y+2, 16, 16, 5);
                ctx.fill();
                
                if(i === 0) { // Eyes based on direction
                    ctx.fillStyle = "#000";
                    let ex = s.x + (dx > 0 ? 12 : dx < 0 ? 2 : 7);
                    let ey = s.y + (dy > 0 ? 12 : dy < 0 ? 2 : 7);
                    ctx.fillRect(ex, ey, 4, 4);
                }
            });

            // Draw Apple
            ctx.fillStyle = "#f00";
            ctx.beginPath();
            ctx.arc(food.x+10, food.y+10, 8, 0, Math.PI*2);
            ctx.fill();

            let head = {x: snake[0].x + dx, y: snake[0].y + dy};
            if(head.x < 0 || head.x >= 400 || head.y < 0 || head.y >= 400) return start();
            snake.unshift(head);
            if(head.x === food.x && head.y === food.y) {
                score++; food = {x: Math.floor(Math.random()*20)*20, y: Math.floor(Math.random()*20)*20};
                document.getElementById("score").innerText = "Score: " + score;
                if(score >= 5) document.getElementById("rank").innerText = "Bronze Viper";
                if(score >= 15) document.getElementById("rank").innerText = "Silver Legend";
            } else snake.pop();
        }
        
        document.addEventListener("keydown", e => {
            if(e.key === " ") togglePause();
            if(e.key === "ArrowUp" && dy === 0) { dx=0; dy=-20; }
            if(e.key === "ArrowDown" && dy === 0) { dx=0; dy=20; }
            if(e.key === "ArrowLeft" && dx === 0) { dx=-20; dy=0; }
            if(e.key === "ArrowRight" && dx === 0) { dx=20; dy=0; }
        });
        start();
    </script>
</body>
</html>
