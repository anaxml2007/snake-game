<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Snake - Universal</title>
    <style>
        :root { --neon-green: #0f0; --neon-red: #f00; --bg-dark: #050505; }
        * { box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; }
        
        body { 
            background: radial-gradient(circle at center, #0a0a1a 0%, var(--bg-dark) 100%); 
            color: #fff; text-align: center; font-family: 'Segoe UI', sans-serif; 
            margin: 0; padding: 0; height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
        }

        /* Header & UI */
        .top-ui { padding: 10px; width: 100%; z-index: 5; }
        h1 { margin: 5px 0; font-size: clamp(20px, 4vw, 32px); text-shadow: 0 0 15px var(--neon-green); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        
        .stats-bar { display: flex; justify-content: center; gap: 15px; font-size: clamp(12px, 2.5vw, 16px); margin-bottom: 5px; }
        #achievement-box { color: #ffd700; text-shadow: 0 0 5px rgba(255,215,0,0.5); }
        #score { color: var(--neon-green); text-shadow: 0 0 5px rgba(0,255,0,0.5); }

        /* Game Container */
        #game-wrapper { 
            position: relative; flex-grow: 1; display: flex; align-items: center; justify-content: center; 
            width: 100%; max-width: 100%; padding: 0 10px;
        }
        canvas { 
            background: #000; border: 3px solid var(--neon-green); border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,255,0,0.3), inset 0 0 30px rgba(0,255,0,0.1);
            max-width: 100%; max-height: 100%; object-fit: contain;
        }

        /* Controls Area */
        .controls-area { 
            width: 100%; padding: 15px 10px 25px; 
            display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 5;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
        }
        
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .btn { 
            background: #1a1a2e; color: #fff; border: 1px solid var(--neon-green); 
            padding: 8px 16px; border-radius: 20px; font-size: 14px; cursor: pointer;
            transition: all 0.2s; min-width: 70px;
        }
        .btn.active { background: var(--neon-green); color: #000; font-weight: bold; box-shadow: 0 0 15px var(--neon-green); }
        .btn-pause { border-color: #fff; }

        /* Virtual Joystick */
        #joystick-zone {
            width: 140px; height: 140px; border-radius: 50%;
            background: rgba(255,255,255,0.05); border: 2px solid rgba(0,255,0,0.3);
            position: relative; display: none; /* Hidden by default, shown via JS */
            backdrop-filter: blur(4px);
        }
        #joystick-knob {
            width: 50px; height: 50px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #0f0, #005500);
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 15px var(--neon-green); pointer-events: none;
            transition: transform 0.1s ease-out;
        }

        /* Overlays */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 20; border-radius: 8px;
        }
        .overlay h2 { color: var(--neon-red); font-size: 36px; text-shadow: 0 0 20px var(--neon-red); margin-bottom: 10px; }
        .overlay p { font-size: 20px; margin-bottom: 20px; }
        .overlay button {
            background: var(--neon-green); color: #000; border: none; padding: 12px 30px;
            font-size: 18px; font-weight: bold; border-radius: 25px; cursor: pointer;
            box-shadow: 0 0 20px rgba(0,255,0,0.5);
        }

        /* Mobile Detection Helper */
        @media (hover: none) and (pointer: coarse) {
            #joystick-zone { display: block; }
            .desktop-hint { display: none; }
        }
    </style>
</head>
<body>

    <div class="top-ui">
        <h1>⚡ NEON SNAKE ⚡</h1>
        <div class="stats-bar">
            <div id="achievement-box">🏆 RANK: <span id="rank">Beginner</span></div>
            <div id="score">Score: 0</div>
        </div>
    </div>

    <div id="game-wrapper">
        <canvas id="game"></canvas>
        <div id="game-over" class="overlay">
            <h2>💀 GAME OVER!</h2>
            <p>Final Score: <span id="final-score">0</span></p>
            <button onclick="startGame()">🔄 Play Again</button>
        </div>
        <div id="start-screen" class="overlay" style="display:flex;">
            <h2 style="color:#0f0; text-shadow:0 0 20px #0f0;">READY?</h2>
            <p class="desktop-hint">Use Arrow Keys or WASD</p>
            <p style="font-size:16px; opacity:0.8;">Swipe joystick on mobile</p>
            <button onclick="startGame()">▶ START GAME</button>
        </div>
    </div>

    <div class="controls-area">
        <div class="btn-group">
            <button class="btn" id="easy" onclick="setSpeed(180, 'easy')">Easy</button>
            <button class="btn active" id="medium" onclick="setSpeed(110, 'medium')">Med</button>
            <button class="btn" id="hard" onclick="setSpeed(60, 'hard')">Hard</button>
            <button class="btn btn-pause" onclick="togglePause()"> Pause</button>
        </div>
        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>
    </div>

<script>
/** CORE CONFIGURATION **/
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let CELL_SIZE = 20;
let COLS = 20, ROWS = 20;

// Game State
let snake = [], food = {}, dx = 0, dy = 0;
let score = 0, speed = 110, paused = false, gameOver = true;
let particles = [], foodPulse = 0, foodDir = 1;
let nextDx = 0, nextDy = 0; // Input buffering

/** INITIALIZATION & RESIZING **/
function resizeCanvas() {
    const wrapper = document.getElementById('game-wrapper');
    const maxW = wrapper.clientWidth - 20;
    const maxH = wrapper.clientHeight - 20;
    
    // Determine optimal cell size (min 15px, max 40px)
    let targetCell = Math.min(maxW / 15, maxH / 15, 40);
    targetCell = Math.max(targetCell, 15);
    CELL_SIZE = Math.floor(targetCell);
    
    COLS = Math.floor(maxW / CELL_SIZE);
    ROWS = Math.floor(maxH / CELL_SIZE);
    
    // Ensure odd numbers for better centering if possible, but not strictly required
    canvas.width = COLS * CELL_SIZE;
    canvas.height = ROWS * CELL_SIZE;
    
    if(gameOver && snake.length === 0) resetPositions();
}

window.addEventListener('resize', () => {
    resizeCanvas();
    if(!gameOver) draw(); // Redraw immediately on resize
});

function resetPositions() {
    const startX = Math.floor(COLS / 2) * CELL_SIZE;
    const startY = Math.floor(ROWS / 2) * CELL_SIZE;
    snake = [{x: startX, y: startY}];
    dx = CELL_SIZE; dy = 0;
    nextDx = CELL_SIZE; nextDy = 0;
    food = generateFood();
}

/** GAME LOGIC **/
function setSpeed(s, id) {
    speed = s;
    document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if (!gameOver) { clearInterval(window.gameLoop); window.gameLoop = setInterval(update, speed); }
}

function togglePause() {
    if (gameOver) return;
    paused = !paused;
    document.querySelector('.btn-pause').innerText = paused ? "▶ Resume" : "⏸ Pause";
}

function generateFood() {
    let newFood, valid = false;
    while (!valid) {
        newFood = {
            x: Math.floor(Math.random() * COLS) * CELL_SIZE,
            y: Math.floor(Math.random() * ROWS) * CELL_SIZE
        };
        valid = !snake.some(s => s.x === newFood.x && s.y === newFood.y);
    }
    return newFood;
}

function createParticles(x, y) {
    for (let i = 0; i < 12; i++) {
        particles.push({
            x: x + CELL_SIZE/2, y: y + CELL_SIZE/2,
            vx: (Math.random()-0.5) * (CELL_SIZE/1.5),
            vy: (Math.random()-0.5) * (CELL_SIZE/1.5),
            life: 1, color: `hsl(${Math.random()*60+10}, 100%, 60%)`
        });
    }
}

function update() {
    if (paused || gameOver) return;
    
    // Apply buffered input
    dx = nextDx; dy = nextDy;
    
    const head = { x: snake[0].x + dx, y: snake[0].y + dy };
    
    // Collision Checks
    if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
        endGame(); return;
    }
    
    snake.unshift(head);
    
    if (head.x === food.x && head.y === food.y) {
        score++;
        createParticles(food.x, food.y);
        food = generateFood();
        document.getElementById("score").innerText = "Score: " + score;
        updateRank();
    } else {
        snake.pop();
    }
    
    draw();
}

function updateRank() {
    const r = document.getElementById("rank");
    if(score>=50) r.innerText="💎 Diamond";
    else if(score>=30) r.innerText="🥇 Gold Master";
    else if(score>=15) r.innerText="🥈 Silver Legend";
    else if(score>=5) r.innerText="🥉 Bronze Viper";
    else r.innerText="Beginner";
}

function endGame() {
    gameOver = true;
    clearInterval(window.gameLoop);
    document.getElementById('final-score').innerText = score;
    document.getElementById('game-over').style.display = 'flex';
}

function startGame() {
    resizeCanvas();
    resetPositions();
    score = 0; paused = false; gameOver = false; particles = [];
    document.getElementById("score").innerText = "Score: 0";
    document.getElementById("rank").innerText = "Beginner";
    document.getElementById('game-over').style.display = 'none';
    document.getElementById('start-screen').style.display = 'none';
    document.querySelector('.btn-pause').innerText = "⏸ Pause";
    
    clearInterval(window.gameLoop);
    window.gameLoop = setInterval(update, speed);
    draw(); // Initial draw
}

/** RENDERING **/
function draw() {
    // Clear
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Grid
    ctx.strokeStyle = "rgba(0,255,0,0.04)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=0; i<=COLS; i++) { ctx.moveTo(i*CELL_SIZE,0); ctx.lineTo(i*CELL_SIZE,canvas.height); }
    for(let i=0; i<=ROWS; i++) { ctx.moveTo(0,i*CELL_SIZE); ctx.lineTo(canvas.width,i*CELL_SIZE); }
    ctx.stroke();
    
    // Food Animation
    foodPulse += 0.15 * foodDir;
    if(foodPulse > 1 || foodPulse < 0) foodDir *= -1;
    
    ctx.shadowBlur = 15 + foodPulse*10;
    ctx.shadowColor = "#f00";
    ctx.fillStyle = "#ff0000";
    ctx.beginPath();
    ctx.arc(food.x + CELL_SIZE/2, food.y + CELL_SIZE/2, (CELL_SIZE/2.5) + foodPulse*(CELL_SIZE/8), 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    
    // Stem
    ctx.strokeStyle = "#0f0"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(food.x+CELL_SIZE/2, food.y+CELL_SIZE/4);
    ctx.lineTo(food.x+CELL_SIZE/2, food.y-CELL_SIZE/8); ctx.stroke();

    // Snake
    const segSize = CELL_SIZE * 0.8;
    const offset = (CELL_SIZE - segSize) / 2;
    
    snake.forEach((s, i) => {
        if(i===0) {
            ctx.fillStyle = "#fff"; ctx.shadowBlur = 25; ctx.shadowColor = "#0f0";
        } else {
            const b = Math.max(30, 60 - (i*1.2));
            ctx.fillStyle = `hsl(120, 100%, ${b}%)`;
            ctx.shadowBlur = Math.max(3, 12-(i*0.6)); ctx.shadowColor = "#0f0";
        }
        
        ctx.beginPath();
        if(ctx.roundRect) ctx.roundRect(s.x+offset, s.y+offset, segSize, segSize, segSize/3);
        else ctx.rect(s.x+offset, s.y+offset, segSize, segSize);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // Eyes
        if(i===0) {
            ctx.fillStyle = "#0000aa";
            const eSize = segSize / 3.5;
            const eOff = segSize / 3;
            
            // Dynamic eye positioning based on direction
            let ex1, ey1, ex2, ey2;
            if(dx > 0) { ex1=s.x+segSize-eOff; ey1=s.y+eOff; ex2=ex1; ey2=s.y+segSize-eOff-eSize; }
            else if(dx < 0) { ex1=s.x+eOff; ey1=s.y+eOff; ex2=ex1; ey2=s.y+segSize-eOff-eSize; }
            else if(dy > 0) { ex1=s.x+eOff; ey1=s.y+segSize-eOff; ex2=s.x+segSize-eOff-eSize; ey2=ey1; }
            else { ex1=s.x+eOff; ey1=s.y+eOff; ex2=s.x+segSize-eOff-eSize; ey2=ey1; }
            
            ctx.fillRect(ex1, ey1, eSize, eSize);
            ctx.fillRect(ex2, ey2, eSize, eSize);
        }
    });

    // Particles
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.life -= 0.04;
        p.vx *= 0.92; p.vy *= 0.92;
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, (CELL_SIZE/5)*p.life, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;
}

/** INPUT HANDLING **/
// Keyboard
document.addEventListener("keydown", e => {
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
    if(e.key === " ") { togglePause(); return; }
    if(gameOver) return;
    
    const k = e.key.toLowerCase();
    if((k==="arrowup"||k==="w") && dy===0) { nextDx=0; nextDy=-CELL_SIZE; }
    if((k==="arrowdown"||k==="s") && dy===0) { nextDx=0; nextDy=CELL_SIZE; }
    if((k==="arrowleft"||k==="a") && dx===0) { nextDx=-CELL_SIZE; nextDy=0; }
    if((k==="arrowright"||k==="d") && dx===0) { nextDx=CELL_SIZE; nextDy=0; }
});

// Touch Joystick
const joyZone = document.getElementById('joystick-zone');
const joyKnob = document.getElementById('joystick-knob');
let joyActive = false, joyStartX = 0, joyStartY = 0;

joyZone.addEventListener('touchstart', e => {
    e.preventDefault();
    joyActive = true;
    const touch = e.touches[0];
    const rect = joyZone.getBoundingClientRect();
    joyStartX = rect.left + rect.width/2;
    joyStartY = rect.top + rect.height/2;
    updateJoystick(touch.clientX, touch.clientY);
}, {passive: false});

joyZone.addEventListener('touchmove', e => {
    e.preventDefault();
    if(!joyActive || gameOver) return;
    updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
}, {passive: false});

const endJoy = (e) => {
    e.preventDefault();
    joyActive = false;
    joyKnob.style.transform = `translate(-50%, -50%)`;
};
joyZone.addEventListener('touchend', endJoy);
joyZone.addEventListener('touchcancel', endJoy);

function updateJoystick(cx, cy) {
    const maxDist = 45; // Max knob travel radius
    let diffX = cx - joyStartX;
    let diffY = cy - joyStartY;
    const dist = Math.sqrt(diffX*diffX + diffY*diffY);
    
    // Clamp visual knob
    if(dist > maxDist) {
        diffX = (diffX/dist) * maxDist;
        diffY = (diffY/dist) * maxDist;
    }
    joyKnob.style.transform = `translate(calc(-50% + ${diffX}px), calc(-50% + ${diffY}px))`;
    
    // Determine direction only if moved significantly
    if(dist > 15 && !gameOver) {
        const absX = Math.abs(diffX);
        const absY = Math.abs(diffY);
        
        if(absX > absY) {
            // Horizontal
            if(diffX > 0 && dx === 0) { nextDx = CELL_SIZE; nextDy = 0; }
            else if(diffX < 0 && dx === 0) { nextDx = -CELL_SIZE; nextDy = 0; }
        } else {
            // Vertical
            if(diffY > 0 && dy === 0) { nextDx = 0; nextDy = CELL_SIZE; }
            else if(diffY < 0 && dy === 0) { nextDx = 0; nextDy = -CELL_SIZE; }
        }
    }
}

// Initial Setup
setTimeout(resizeCanvas, 50); // Small delay to ensure DOM is ready
</script>
</body>
</html>
